[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mingseal-immutable-memory"
version = "0.1.0"
description = "Immutable memory system for AI Agents based on Craig Wright's paper on memory systems"
readme = "README.md"
license = "MIT"
authors = [
    { name = "MingChain" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "aiosqlite>=0.20",
    "aiohttp>=3.9.0",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.3.0",
]

[project.scripts]
mingseal-memory = "mingseal_immutable_memory.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mingseal_immutable_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
